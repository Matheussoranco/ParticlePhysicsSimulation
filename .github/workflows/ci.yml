name: Ada compilation and execution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y gnat gprbuild
      - name: Compile Ada with assertions and validity checks
        run: gprbuild -P particle_sim.gpr
      - name: Validate scenario outputs and reproducible seeds
        run: python3 tests/test_native_execution.py
